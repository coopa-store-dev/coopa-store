# Coopa Store 商店目录。kr2 的构建服务每分钟拉一次 main 上的这个文件:生成卡上的商店目录、按组合编固件。
# 官网(app.xiaokuba.com)审核通过、下架、退回版本时自动改它;平时不要手改。
# [[game]] 的顺序 = 开机 init 顺序和菜单顺序。条目永不删除:下架只改 listed = false。
# repo = "local:…" 是外壳自带的游戏(源码在外壳里);"https://github.com/…" 是开发者的仓库,commit 是审核通过的那个。
# tags:"pick" = 店主推荐,"new" = 新上架。icons:0..2 个 16×16 PNG,路径相对本文件所在目录。
